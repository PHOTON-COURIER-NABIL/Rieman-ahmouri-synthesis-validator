[project]
name = "rieman-ahmouri-synthesis-validator"
version = "0.1.0"
description = "Numerical-symbolic validator bridging Riemann zeta zeros and 59D geometric framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "PHOTON-COURIER-NABIL" } ]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.11.4",
    "sympy==1.12",
    "mpmath==1.3.0",
    "matplotlib==3.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "bandit==1.7.9",
    "pip-audit==2.7.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
