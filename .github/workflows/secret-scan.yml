name: Secret scanning (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quick grep-based secret scan
        run: |
          set -euo pipefail
          echo "Running quick secret scan..."
          patterns='API[_-]?KEY|SECRET|TOKEN|PASSWORD|PRIVATE_KEY|aws_access_key_id|aws_secret_access_key|-----BEGIN PRIVATE KEY-----'
          matches=$(git grep -InE --exclude-dir=.git --exclude-dir=dist -e "$patterns" || true)
          if [ -n "$matches" ]; then
            echo "Potential secrets detected:" >&2
            echo "$matches" >&2
            exit 1
          else
            echo "No obvious secrets found by quick scan."
          fi
